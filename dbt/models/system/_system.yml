version: 2
models:
  - name: sys_sales_daily
    description: Daily branch sales serving contract; completed orders only.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ID_SUCURSAL, FECHA]
    columns:
      - name: FECHA
        data_tests: [not_null]
      - name: ID_SUCURSAL
        data_tests: [not_null]
      - name: INGRESOS
        data_tests: [not_null]
  - name: sys_customer_orders
    description: Identified completed orders for point-in-time customer features.
    columns:
      - name: ID_PEDIDO
        data_tests: [unique, not_null]
      - name: ID_CLIENTE
        data_tests: [not_null]
      - name: FECHA
        data_tests: [not_null]
  - name: sys_branch_monthly
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ID_SUCURSAL, MES_FECHA]
    columns:
      - name: COSTOS_DISPONIBLES
        data_tests: [not_null]
  - name: sys_product_weekly
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ID_SUCURSAL, ID_PRODUCTO, SEMANA]
    columns:
      - name: COSTO_ESTANDAR
        data_tests: [not_null]
  - name: sys_customer_features
    description: Point-in-time customer OBT with MongoDB registration, 180-day features and mature 90-day labels. No contact PII.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ID_CLIENTE, CUTOFF]
    columns:
      - name: ID_CLIENTE
        data_tests: [not_null]
      - name: CUTOFF
        data_tests: [not_null]
      - name: FREQUENCY
        data_tests: [not_null]
