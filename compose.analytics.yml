services:
  pipeline:
    user: "50000:0"
    build:
      context: .
      dockerfile: hgc-ml/Dockerfile
    env_file:
      - hgc-back/.env
      - dbt/.env
    environment:
      POSTGRES_HOST: host.docker.internal
      MLFLOW_TRACKING_URI: sqlite:////workspace/hgc-ml/artifacts/mlflow.db
    volumes:
      - .:/workspace
    extra_hosts:
      - host.docker.internal:host-gateway
  mlflow:
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_SERVER_JOB_ENABLE_PERIODIC_TASKS: "false"
    build:
      context: .
      dockerfile: hgc-ml/Dockerfile
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--workers", "1", "--backend-store-uri", "sqlite:////workspace/hgc-ml/artifacts/mlflow.db", "--default-artifact-root", "/workspace/hgc-ml/artifacts/mlruns"]
    volumes:
      - ./hgc-ml:/workspace/hgc-ml
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

  inference:
    image: hgc-system-vf-pipeline:latest
    command: ["python", "-m", "uvicorn", "serving.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    env_file:
      - hgc-back/.env
    environment:
      POSTGRES_HOST: host.docker.internal
      MLFLOW_TRACKING_URI: sqlite:////workspace/hgc-ml/artifacts/mlflow.db
    volumes:
      - ./hgc-ml:/workspace/hgc-ml
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  notebooks:
    profiles: [research]
    build:
      context: .
      dockerfile: hgc-ml/notebooks/Dockerfile
    user: "50000:0"
    env_file:
      - hgc-back/.env
    environment:
      POSTGRES_HOST: host.docker.internal
      MLFLOW_TRACKING_URI: sqlite:////workspace/hgc-ml/artifacts/mlflow.db
    volumes:
      - .:/workspace
    extra_hosts:
      - host.docker.internal:host-gateway
