x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  image: hgc-airflow:2.9.3
  env_file:
    - .env
    - ../dbt/.env
    - ../hgc-back/.env
  environment: &airflow-environment
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/La_Paz
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    POSTGRES_HOST: host.docker.internal
    MLFLOW_TRACKING_URI: sqlite:////workspace/hgc-ml/artifacts/mlflow.db
    PYTHONPATH: /workspace/hgc-ml
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./logs:/opt/airflow/logs
    - ../hgc-ml:/workspace/hgc-ml
    - ../dbt:/workspace/dbt
  extra_hosts:
    - host.docker.internal:host-gateway
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    environment:
      <<: *airflow-environment
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: "${AIRFLOW_ADMIN_USERNAME:-admin}"
      _AIRFLOW_WWW_USER_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD:?Configure AIRFLOW_ADMIN_PASSWORD in airflow/.env}"
      _AIRFLOW_WWW_USER_FIRSTNAME: "${AIRFLOW_ADMIN_FIRSTNAME:-Admin}"
      _AIRFLOW_WWW_USER_LASTNAME: "${AIRFLOW_ADMIN_LASTNAME:-User}"
      _AIRFLOW_WWW_USER_EMAIL: "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}"
    command: version
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    ports:
      - "127.0.0.1:8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
    name: airflow_postgres_data
